<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Dual-pipeline architecture</title>
  <desc id="archDesc">A Word file is uploaded to both Pipeline A on Linux port 8899 and Pipeline B on Windows port 8090. Pipeline A produces a PDF parsed by pdfplumber. Pipeline B prints to XPS and extracts text, coordinates, and page PNGs. Both results meet on the compare page for side-by-side pages, per-line diffs, and a line-count verdict.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1612"/>
    </marker>
  </defs>
  <rect width="920" height="280" fill="#faf6ee"/>
  <rect x="16" y="88" width="150" height="88" fill="#1a1612" stroke="#1a1612"/>
  <text x="91" y="124" text-anchor="middle" fill="#f3eee4" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600">Upload</text>
  <text x="91" y="146" text-anchor="middle" fill="#f3eee4" font-family="IBM Plex Mono, monospace" font-size="11">.doc / .docx</text>
  <line x1="166" y1="116" x2="228" y2="72" stroke="#1a1612" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="166" y1="148" x2="228" y2="196" stroke="#1a1612" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="232" y="28" width="220" height="88" fill="#e4f0e4" stroke="#1a5c28" stroke-width="2"/>
  <text x="342" y="56" text-anchor="middle" fill="#1a5c28" font-family="IBM Plex Mono, monospace" font-size="11">PIPELINE A / LINUX :8899</text>
  <text x="342" y="80" text-anchor="middle" fill="#1a1612" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600">LibreOffice + UNO fixer</text>
  <text x="342" y="100" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="12">headless convert</text>
  <rect x="232" y="164" width="220" height="88" fill="#e3ebf4" stroke="#163f73" stroke-width="2"/>
  <text x="342" y="192" text-anchor="middle" fill="#163f73" font-family="IBM Plex Mono, monospace" font-size="11">PIPELINE B / WINDOWS :8090</text>
  <text x="342" y="216" text-anchor="middle" fill="#1a1612" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600">Word COM to XPS printer</text>
  <text x="342" y="236" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="12">print-parse node</text>
  <line x1="452" y1="72" x2="508" y2="72" stroke="#1a1612" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="452" y1="208" x2="508" y2="208" stroke="#1a1612" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="512" y="32" width="168" height="80" fill="#e4f0e4" stroke="#1a5c28"/>
  <text x="596" y="62" text-anchor="middle" fill="#1a1612" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600">PDF</text>
  <text x="596" y="84" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="11">pdfplumber text + coords</text>
  <rect x="512" y="168" width="168" height="80" fill="#e3ebf4" stroke="#163f73"/>
  <text x="596" y="198" text-anchor="middle" fill="#1a1612" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600">XPS parse</text>
  <text x="596" y="220" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="11">text + coords + PNG</text>
  <line x1="680" y1="72" x2="736" y2="124" stroke="#1a1612" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="208" x2="736" y2="156" stroke="#1a1612" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="740" y="88" width="164" height="104" fill="#f3e6c8" stroke="#1a1612" stroke-width="2"/>
  <text x="822" y="122" text-anchor="middle" fill="#1a1612" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600">Compare UI</text>
  <text x="822" y="144" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="11">side-by-side pages</text>
  <text x="822" y="162" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="11">per-line text / coords</text>
  <text x="822" y="180" text-anchor="middle" fill="#3d352c" font-family="IBM Plex Sans, sans-serif" font-size="11">line-count verdict</text>
</svg>
